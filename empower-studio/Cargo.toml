[package]
name = "empower-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
empower-engine = { path = "../empower-engine" }

# Lazy loading
once_cell = "1.21.4"

# Visuals
eframe = "0.34.0"
egui = { version="0.34.0", features = ["serde"]}
egui_extras = { version = "0.34.0", features = ["default", "all_loaders"] } 
egui_dock = { version = "0.19" ,features = ["serde"]}
image = { version = "0.25", default-features = false, features = ["png"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"

# File handling
rfd = "0.17.2"
directories = "5.0"
fs_extra = "1.3"
