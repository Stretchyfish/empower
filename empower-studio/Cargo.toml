[package]
name = "empower-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
empower-engine = { path = "../empower-engine" }
eframe = "0.32.0"
egui = {version="0.32.0", features = ["serde"]}
egui_extras = { version = "0.32.0", features = ["default", "all_loaders"] } 
egui_dock = "0.17"
once_cell = "1.21.3"
rfd = "0.15.4"
image = { version = "0.25", features = ["jpeg", "png"] } 
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"

fs_extra = "1.3"

