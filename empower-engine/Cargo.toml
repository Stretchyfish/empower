[package]
name = "empower-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lazy loading
once_cell = "1.21.4"

# Visualization
eframe = "0.34.0"
egui = "0.34.0"
egui_plot = "0.35.0" # Compatible with egui 0.34
image = { version = "0.25", default-features = false, features = ["png"] }


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"

# File handling
rfd = "0.17.2"
fs_extra = "1.3"

